<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FMI Sää - Kulosaari, Helsinki</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .weather-widget {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            overflow: hidden;
        }

        .widget-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .widget-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .widget-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .widget-content {
            padding: 30px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #e74c3c;
        }

        .error-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .current-weather {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .current-temp {
            font-size: 64px;
            font-weight: bold;
            color: #333;
        }

        .current-condition {
            font-size: 18px;
            color: #666;
            margin-top: 10px;
        }

        .current-emoji {
            font-size: 80px;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .detail-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .detail-icon {
            font-size: 24px;
        }

        .detail-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 3px;
        }

        .detail-value {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .forecast-section {
            margin-top: 20px;
        }

        .forecast-title {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        .forecast-hours {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .forecast-hours::-webkit-scrollbar {
            height: 6px;
        }

        .forecast-hours::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .forecast-hours::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .forecast-hour {
            min-width: 80px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            flex-shrink: 0;
        }

        .forecast-hour.rainy {
            background: #e3f2fd;
            border: 2px solid #2196f3;
        }

        .forecast-time {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .forecast-emoji {
            font-size: 32px;
            margin: 8px 0;
        }

        .forecast-temp {
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }

        .forecast-rain {
            font-size: 12px;
            color: #2196f3;
            margin-top: 5px;
        }

        .widget-footer {
            text-align: center;
            padding: 15px;
            background: #f8f9fa;
            font-size: 12px;
            color: #666;
        }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 15px;
            transition: background 0.3s;
        }

        .refresh-btn:hover {
            background: #5568d3;
        }

        .last-update {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            .current-temp {
                font-size: 48px;
            }

            .current-emoji {
                font-size: 60px;
            }

            .weather-details {
                grid-template-columns: 1fr;
            }

            .forecast-hour {
                min-width: 70px;
            }
        }
    </style>
</head>
<body>
    <div class="weather-widget">
        <div class="widget-header">
            <h1>🌤️ Sää Kulosaari</h1>
            <p>Helsinki, Suomi</p>
        </div>

        <div class="widget-content" id="weatherContent">
            <div class="loading">
                <div class="spinner"></div>
                <p>Ladataan säätietoja FMI:ltä...</p>
            </div>
        </div>

        <div class="widget-footer">
            <p>Tiedot: Ilmatieteen laitos (FMI) Open Data</p>
            <p class="last-update" id="lastUpdate"></p>
        </div>
    </div>

    <script>
        // FMI API URLs for Kulosaari, Helsinki
        const FMI_OBSERVATIONS_URL = 'https://opendata.fmi.fi/wfs?service=WFS&version=2.0.0&request=getFeature&storedquery_id=fmi::observations::weather::simple&lat=60.187&lon=25.006&parameters=t2m,ws_10min,rh,r_1h';
        const FMI_FORECAST_URL = 'https://opendata.fmi.fi/wfs?service=WFS&version=2.0.0&request=getFeature&storedquery_id=fmi::forecast::harmonie::surface::point::simple&lat=60.187&lon=25.006&parameters=Temperature,PrecipitationAmount,TotalCloudCover';

        // Calculate "feels like" temperature
        function calculateFeelsLike(temp, windSpeed) {
            return Math.round(temp - (windSpeed * 0.7));
        }

        // Determine weather condition
        function getWeatherCondition(rain, clouds) {
            if (rain > 0) {
                return { text: 'Sateinen', emoji: '🌧️' };
            } else if (clouds < 20) {
                return { text: 'Aurinkoinen', emoji: '☀️' };
            } else if (clouds < 60) {
                return { text: 'Puolipilvinen', emoji: '⛅' };
            } else {
                return { text: 'Pilvinen', emoji: '☁️' };
            }
        }

        // Parse FMI XML observations
        function parseObservations(xml) {
            const members = xml.getElementsByTagName('wfs:member');
            
            let latestData = {
                temperature: null,
                windSpeed: null,
                humidity: null,
                precipitation: null,
                timestamp: null
            };

            // Parse all members and find the latest complete data
            for (let i = members.length - 1; i >= 0; i--) {
                const member = members[i];
                const time = member.getElementsByTagName('BsWfs:Time')[0]?.textContent;
                const paramName = member.getElementsByTagName('BsWfs:ParameterName')[0]?.textContent;
                const paramValue = member.getElementsByTagName('BsWfs:ParameterValue')[0]?.textContent;

                if (time && paramName && paramValue) {
                    if (paramName === 't2m' && latestData.temperature === null) {
                        latestData.temperature = parseFloat(paramValue);
                        latestData.timestamp = time;
                    } else if (paramName === 'ws_10min' && latestData.windSpeed === null) {
                        latestData.windSpeed = parseFloat(paramValue);
                    } else if (paramName === 'rh' && latestData.humidity === null) {
                        latestData.humidity = parseFloat(paramValue);
                    } else if (paramName === 'r_1h' && latestData.precipitation === null) {
                        latestData.precipitation = parseFloat(paramValue);
                    }
                }
            }

            const temp = latestData.temperature;
            const windSpeed = latestData.windSpeed;
            const humidity = latestData.humidity || 0;
            const precipitation = latestData.precipitation || 0;

            const feelsLike = calculateFeelsLike(temp, windSpeed);
            const estimatedClouds = precipitation > 0 ? 80 : 30;
            const condition = getWeatherCondition(precipitation, estimatedClouds);

            return {
                temperature: Math.round(temp),
                windSpeed: Math.round(windSpeed * 10) / 10,
                humidity: Math.round(humidity),
                precipitation: Math.round(precipitation * 10) / 10,
                feelsLike,
                condition: condition.text,
                conditionEmoji: condition.emoji,
                timestamp: latestData.timestamp
            };
        }

        // Parse FMI XML forecast
        function parseForecast(xml) {
            const members = xml.getElementsByTagName('wfs:member');
            const timeData = {};

            for (let i = 0; i < members.length; i++) {
                const member = members[i];
                const time = member.getElementsByTagName('BsWfs:Time')[0]?.textContent;
                const paramName = member.getElementsByTagName('BsWfs:ParameterName')[0]?.textContent;
                const paramValue = member.getElementsByTagName('BsWfs:ParameterValue')[0]?.textContent;

                if (time && paramName && paramValue) {
                    if (!timeData[time]) {
                        timeData[time] = {
                            time,
                            temperature: null,
                            precipitation: null,
                            cloudCover: null
                        };
                    }

                    if (paramName === 'Temperature') {
                        timeData[time].temperature = parseFloat(paramValue);
                    } else if (paramName === 'PrecipitationAmount') {
                        timeData[time].precipitation = parseFloat(paramValue);
                    } else if (paramName === 'TotalCloudCover') {
                        timeData[time].cloudCover = parseFloat(paramValue);
                    }
                }
            }

            const forecasts = [];
            const now = new Date();

            for (const time in timeData) {
                const data = timeData[time];
                const forecastTime = new Date(time);

                if (forecastTime > now && forecasts.length < 24) {
                    if (data.temperature !== null && data.cloudCover !== null) {
                        const condition = getWeatherCondition(data.precipitation || 0, data.cloudCover);
                        const hour = forecastTime.getHours();

                        forecasts.push({
                            time: time,
                            hour: hour.toString(),
                            temperature: Math.round(data.temperature),
                            precipitation: Math.round((data.precipitation || 0) * 10) / 10,
                            cloudCover: Math.round(data.cloudCover),
                            condition: condition.text,
                            conditionEmoji: condition.emoji
                        });
                    }
                }
            }

            return forecasts.slice(0, 24);
        }

        // Render weather UI
        function renderWeather(current, forecast) {
            const content = document.getElementById('weatherContent');
            
            let forecastHTML = '';
            forecast.slice(0, 12).forEach(hour => {
                const rainClass = hour.precipitation > 0 ? 'rainy' : '';
                const rainHTML = hour.precipitation > 0 ? `<div class="forecast-rain">💧 ${hour.precipitation}mm</div>` : '';
                
                forecastHTML += `
                    <div class="forecast-hour ${rainClass}">
                        <div class="forecast-time">${hour.hour}:00</div>
                        <div class="forecast-emoji">${hour.conditionEmoji}</div>
                        <div class="forecast-temp">${hour.temperature}°</div>
                        ${rainHTML}
                    </div>
                `;
            });

            content.innerHTML = `
                <div class="current-weather">
                    <div>
                        <div class="current-temp">${current.temperature}°C</div>
                        <div class="current-condition">${current.condition} ${current.conditionEmoji}</div>
                    </div>
                    <div class="current-emoji">${current.conditionEmoji}</div>
                </div>

                <div class="weather-details">
                    <div class="detail-item">
                        <div class="detail-icon">💨</div>
                        <div>
                            <div class="detail-label">Tuuli</div>
                            <div class="detail-value">${current.windSpeed} m/s</div>
                        </div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-icon">💧</div>
                        <div>
                            <div class="detail-label">Kosteus</div>
                            <div class="detail-value">${current.humidity}%</div>
                        </div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-icon">🌡️</div>
                        <div>
                            <div class="detail-label">Tuntuu kuin</div>
                            <div class="detail-value">${current.feelsLike}°C</div>
                        </div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-icon">🌧️</div>
                        <div>
                            <div class="detail-label">Sade (1h)</div>
                            <div class="detail-value">${current.precipitation} mm</div>
                        </div>
                    </div>
                </div>

                <div class="forecast-section">
                    <div class="forecast-title">24 tunnin ennuste</div>
                    <div class="forecast-hours">
                        ${forecastHTML}
                    </div>
                </div>

                <button class="refresh-btn" onclick="loadWeather()">🔄 Päivitä</button>
            `;

            // Update last update time
            const now = new Date();
            document.getElementById('lastUpdate').textContent = 
                `Päivitetty: ${now.toLocaleTimeString('fi-FI', { hour: '2-digit', minute: '2-digit' })}`;
        }

        // Show error
        function showError(message) {
            const content = document.getElementById('weatherContent');
            content.innerHTML = `
                <div class="error">
                    <div class="error-icon">⚠️</div>
                    <p><strong>Virhe:</strong> ${message}</p>
                    <button class="refresh-btn" onclick="loadWeather()">🔄 Yritä uudelleen</button>
                </div>
            `;
        }

        // Load weather data
        async function loadWeather() {
            const content = document.getElementById('weatherContent');
            content.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Ladataan säätietoja FMI:ltä...</p>
                </div>
            `;

            try {
                console.log('🌤️ Fetching weather from FMI...');

                // Fetch observations and forecast in parallel
                const [obsResponse, forecastResponse] = await Promise.all([
                    fetch(FMI_OBSERVATIONS_URL),
                    fetch(FMI_FORECAST_URL)
                ]);

                if (!obsResponse.ok || !forecastResponse.ok) {
                    throw new Error('FMI API virhe');
                }

                const obsText = await obsResponse.text();
                const forecastText = await forecastResponse.text();

                const parser = new DOMParser();
                const obsXML = parser.parseFromString(obsText, 'text/xml');
                const forecastXML = parser.parseFromString(forecastText, 'text/xml');

                // Check for errors
                const obsError = obsXML.getElementsByTagName('ows:ExceptionText')[0]?.textContent;
                const forecastError = forecastXML.getElementsByTagName('ows:ExceptionText')[0]?.textContent;
                
                if (obsError || forecastError) {
                    throw new Error('FMI API virhe: ' + (obsError || forecastError));
                }

                const current = parseObservations(obsXML);
                const forecast = parseForecast(forecastXML);

                console.log('✅ Weather data loaded:', current, forecast);

                renderWeather(current, forecast);
            } catch (error) {
                console.error('❌ Error loading weather:', error);
                showError('Säätietojen lataus epäonnistui. Tarkista internet-yhteys.');
            }
        }

        // Load weather on page load
        loadWeather();

        // Auto-refresh every 5 minutes
        setInterval(loadWeather, 5 * 60 * 1000);
    </script>
</body>
</html>
