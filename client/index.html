    <meta charset="UTF-8" />
    <!-- v3.25.8 — disable browser autotranslate for the whole app.
         Chrome/Safari's "always translate this page" was rewriting
         labels like "FL" (floor abbreviation) into "Florida" and
         garbling room numbers/POI names that map to real-world
         entities and must NOT be translated. The i18n system provides
         proper Finnish translations for UI copy; the map data is
         proper nouns and should stay as-is. -->
    <meta name="google" content="notranslate" />
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <!-- PWA manifest link removed 2026-07-16 — Vercel Deployment
         Protection on dev.ksykmaps.fi intercepts /manifest.json with
         a 302 to vercel.com/sso-api, and the SSO endpoint doesn't
         send an Access-Control-Allow-Origin header. That caused a
         CORS error on every page load on protected deployments.
         PWA "Add to home screen" isn't a shipping feature yet, so
         dropping the tag is the cleanest fix. Re-add once Deployment
         Protection is disabled OR the manifest is hosted somewhere
         Vercel SSO doesn't gate. -->
    <!-- <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" /> -->
